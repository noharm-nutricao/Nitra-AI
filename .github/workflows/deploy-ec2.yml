name: Deploy EC2

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "pom.xml"
      - "src/**"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: ./mvnw -q test package -Dquarkus.package.jar.type=uber-jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Read Terraform outputs
        id: infra
        working-directory: infra/terraform
        run: |
          ARTIFACT_BUCKET=$(terraform output -raw artifact_bucket_name)
          INSTANCE_ID=$(terraform output -raw instance_id)
          SERVICE_URL=$(terraform output -raw service_url)
          DEPLOY_SCRIPT=$(terraform output -raw deploy_script_path)

          test -n "$ARTIFACT_BUCKET"
          test -n "$INSTANCE_ID"
          test -n "$SERVICE_URL"
          test -n "$DEPLOY_SCRIPT"

          echo "artifact_bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "deploy_script=$DEPLOY_SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to S3
        id: upload
        run: |
          test -n "${{ steps.infra.outputs.artifact_bucket }}"

          ARTIFACT_KEY="releases/${GITHUB_SHA}/nitra-ai-runner.jar"
          ARTIFACT_PATH=$(ls target/*-runner.jar | head -n 1)

          aws s3 cp "$ARTIFACT_PATH" "s3://${{ steps.infra.outputs.artifact_bucket }}/${ARTIFACT_KEY}"

          echo "artifact_key=${ARTIFACT_KEY}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.infra.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters commands="sudo ${{ steps.infra.outputs.deploy_script }} s3://${{ steps.infra.outputs.artifact_bucket }}/${{ steps.upload.outputs.artifact_key }}" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.infra.outputs.instance_id }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.infra.outputs.instance_id }}"

      - name: Smoke test
        run: |
          curl --fail --retry 15 --retry-delay 5 "${{ steps.infra.outputs.service_url }}/q/openapi" > /dev/null
